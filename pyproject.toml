[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yieldcurves"
version = "0.1.0"
description = "Sovereign yield curve ingestion, normalisation and storage pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "openpyxl>=3.1",
    "odfpy>=1.4",
    "pyarrow>=14",
    "duckdb>=0.9",
    "python-dateutil>=2.8",
    "pydantic>=2.5",
    "tenacity>=8.2",
    "click>=8.1",
    "pyyaml>=6.0",
    "chardet>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "playwright>=1.40",
    "types-python-dateutil>=2.8",
    "types-pyyaml>=6.0",
    "types-requests>=2.31",
]

[project.scripts]
yieldcurves = "yieldcurves.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["yieldcurves*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["src/yieldcurves/tests"]
python_files = ["test_*.py"]
