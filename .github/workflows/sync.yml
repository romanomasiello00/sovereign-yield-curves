name: Sync yield curves

on:
  schedule:
    # Japan: daily 10:00 Tokyo = 01:00 UTC in winter, 00:00 UTC in summer
    - cron: "30 1 * * 1-5"
    # UK: daily 13:00 London = 12:00 UTC in winter, 11:00 UTC in summer
    - cron: "30 12 * * 1-5"
    # Germany / Italy: daily 18:00 CET = 17:00 UTC in winter, 15:00 UTC in summer
    - cron: "30 16 * * 1-5"
    # Netherlands: monthly on 3rd at 08:00 CET
    - cron: "30 7 3 * *"
    # BDS monthly publications (SDDS, MFN, BAM, BOP, FPI, STAFINRA): 10th monthly
    - cron: "0 8 10 * *"
    # BDS quarterly publications (CFI, STACORIS): 15th of Feb/May/Aug/Nov
    - cron: "0 8 15 2,5,8,11 *"
    # BDS annual publications (FPR, FPE): 30th of April
    - cron: "0 8 30 4 *"
    # BDS semi-annual (STAATER, STASDP): 30th of April and October
    - cron: "0 8 30 4,10 *"
  workflow_dispatch:
    inputs:
      target:
        description: "Sync target (JP, GB, DE, NL, IT, ALL, BDS, ALL_BDS, or ALL)"
        required: true
        default: "ALL"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache yield curve data
        uses: actions/cache@v4
        with:
          path: data/
          key: yield-curve-data-${{ github.run_id }}
          restore-keys: |
            yield-curve-data-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Determine sync target
        id: target
        run: |
          INPUT="${{ github.event.inputs.target }}"
          if [[ -z "$INPUT" || "$INPUT" == "ALL" ]]; then
            echo "flag=--all" >> $GITHUB_OUTPUT
            echo "bds_flag=" >> $GITHUB_OUTPUT
          elif [[ "$INPUT" == "BDS" || "$INPUT" == "ALL_BDS" ]]; then
            echo "flag=" >> $GITHUB_OUTPUT
            echo "bds_flag=--workers 4" >> $GITHUB_OUTPUT
          else
            echo "flag=--country $INPUT" >> $GITHUB_OUTPUT
            echo "bds_flag=" >> $GITHUB_OUTPUT
          fi

      - name: Sync yield curve data
        if: steps.target.outputs.flag != ''
        run: |
          yieldcurves sync ${{ steps.target.outputs.flag }}

      - name: Sync BDS data
        if: steps.target.outputs.bds_flag != '' || steps.target.outputs.flag == '--all'
        run: |
          yieldcurves bds sync -w 4

      - name: Validate outputs
        run: |
          if [ -f scripts/validate_outputs.py ]; then
            python scripts/validate_outputs.py
          fi

      - name: Commit and push updated data
        run: |
          git config user.name "yield-curve-bot"
          git config user.email "yield-curve-bot@users.noreply.github.com"
          git add data/ metadata/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update yield curve data [skip ci]"
            git push
          fi

      - name: Upload artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yield-curve-data
          path: data/
          retention-days: 7
