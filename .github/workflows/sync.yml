name: Sync yield curves

on:
  schedule:
    # Japan: daily 10:00 Tokyo = 01:00 UTC in winter, 00:00 UTC in summer
    - cron: "30 1 * * 1-5"
    # UK: daily 13:00 London = 12:00 UTC in winter, 11:00 UTC in summer
    - cron: "30 12 * * 1-5"
    # Germany / Italy: daily 18:00 CET = 17:00 UTC in winter, 15:00 UTC in summer
    - cron: "30 16 * * 1-5"
    # Australia RBA: daily 11:30 AEDT = 00:30 UTC in summer, 01:30 UTC in winter
    - cron: "30 1 * * 1-5"
    # Sweden Riksbank: daily 10:00 CET = 09:00 UTC
    - cron: "0 9 * * 1-5"
    # Norway Norges Bank: daily 10:00 CET = 09:00 UTC
    - cron: "30 9 * * 1-5"
    # Singapore MAS: daily 18:00 SGT = 10:00 UTC
    - cron: "0 10 * * 1-5"
    # Netherlands: monthly on 3rd at 08:00 CET
    - cron: "30 7 3 * *"
    # BDS monthly publications (SDDS, MFN, BAM, BOP, FPI, STAFINRA): 10th monthly
    - cron: "0 8 10 * *"
    # BDS quarterly publications (CFI, STACORIS): 15th of Feb/May/Aug/Nov
    - cron: "0 8 15 2,5,8,11 *"
    # BDS annual publications (FPR, FPE): 30th of April
    - cron: "0 8 30 4 *"
    # BDS semi-annual (STAATER, STASDP): 30th of April and October
    - cron: "0 8 30 4,10 *"
  workflow_dispatch:
    inputs:
      target:
        description: "Sync target (JP, GB, DE, NL, IT, AU, SE, NO, SG, ALL, BDS, or ALL_BDS)"
        required: true
        default: "ALL"

permissions:
  contents: write

concurrency:
  group: sync-yield-curves-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache yield curve data
        uses: actions/cache@v4
        with:
          path: data/
          key: yield-curve-data-${{ github.run_id }}
          restore-keys: |
            yield-curve-data-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Determine sync target
        id: target
        run: |
          INPUT="${{ github.event.inputs.target }}"
          SCHEDULE="${{ github.event.schedule }}"
          if [[ -n "$SCHEDULE" ]]; then
            case "$SCHEDULE" in
              "0 8 10 * *"|"0 8 15 2,5,8,11 *"|"0 8 30 4 *"|"0 8 30 4,10 *")
                echo "flag=" >> $GITHUB_OUTPUT
                echo "bds_flag=--workers 4" >> $GITHUB_OUTPUT
                exit 0
                ;;
            esac
          fi
          if [[ -z "$INPUT" || "$INPUT" == "ALL" ]]; then
            echo "flag=--all" >> $GITHUB_OUTPUT
            echo "bds_flag=" >> $GITHUB_OUTPUT
          elif [[ "$INPUT" == "BDS" || "$INPUT" == "ALL_BDS" ]]; then
            echo "flag=" >> $GITHUB_OUTPUT
            echo "bds_flag=--workers 4" >> $GITHUB_OUTPUT
          else
            echo "flag=--country $INPUT" >> $GITHUB_OUTPUT
            echo "bds_flag=" >> $GITHUB_OUTPUT
          fi

      - name: Sync yield curve data
        if: steps.target.outputs.flag != ''
        run: |
          yieldcurves sync ${{ steps.target.outputs.flag }}

      - name: Check latest parquet artifact source
        id: latest
        if: success() && steps.target.outputs.flag != ''
        run: |
          if [ ! -f data/processed/yield_curves_latest.parquet ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if head -c 64 data/processed/yield_curves_latest.parquet | grep -q "git-lfs"; then
            echo "latest parquet is only an LFS pointer; skipping macro dispatch"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload latest parquet artifact
        if: success() && steps.latest.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yield-curves-latest
          path: data/processed/yield_curves_latest.parquet
          retention-days: 7
          compression-level: 0

      - name: Notify macro_database (refresh webapp)
        if: success() && steps.latest.outputs.ready == 'true'
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.MACRO_DB_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/romanomasiello00/macro_database/dispatches \
            -d '{"event_type":"provider-updated","client_payload":{"provider":"yieldcurves","source_repo":"romanomasiello00/sovereign-yield-curves","source_run_id":"${{ github.run_id }}","artifact_name":"yield-curves-latest"}}'

      - name: Sync BDS data
        if: steps.target.outputs.bds_flag != ''
        run: |
          yieldcurves bds sync ${{ steps.target.outputs.bds_flag }}

      - name: Validate outputs
        run: |
          if [ -f scripts/validate_outputs.py ]; then
            python scripts/validate_outputs.py
          fi

      - name: Commit and push updated data
        run: |
          git config user.name "yield-curve-bot"
          git config user.email "yield-curve-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update yield curve data [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed; rebasing on latest origin/main (attempt $attempt)"
              git pull --rebase origin main
            done
            git push
          fi

      - name: Upload artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yield-curve-data
          path: data/
          retention-days: 7
